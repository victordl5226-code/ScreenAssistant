# Version catalog (M24, Lote 10): catálogo MÍNIMO y deliberado.
#
# Solo se catalogan las versiones duplicadas REALES (Room en 2 módulos; junit,
# mockk y coroutines-test en 4-5 módulos). El resto de versiones (Compose BOM,
# Hilt, serialization, coroutines-core, WorkManager…) permanece hardcodeado:
# migración gradual documentada — tocar todo el build en un lote de menores
# eleva el riesgo sin valor funcional (criterio del Arquitecto, §2.1c).
#
# Room resuelve a 2.6.1 (sin bump): CorrespondenciaWireTest y los tests de
# DAO dependen del esquema; subir de versión es un lote aparte.

[versions]
room = "2.6.1"
junit = "4.13.2"
mockk = "1.13.12"
coroutines-test = "1.9.0"
# Lote 12 (M6/M13): excepción de regla autorizada — Robolectric + androidx.test + JaCoCo
robolectric = "4.14.1"
androidx-test-core = "1.6.1"
androidx-test-ext-junit = "1.2.1"
androidx-test-runner = "1.6.2"
androidx-test-rules = "1.6.1"
jacoco = "0.8.13"

[libraries]
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidx-test-rules" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }